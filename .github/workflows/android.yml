name: Android

on:
    push:
        branches: [main]
        tags: ["android-v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    apk:
        runs-on: ubuntu-latest
        env:
            # optional; without them the APK is signed with a throwaway debug key and cannot update an installed copy
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            BV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            BV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            BV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Build the web side (shim, BetterDiscord, settings page)
              run: pnpm build:android
            - name: Check the web side
              run: pnpm test:android

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.14.3"

            - name: Version
              id: version
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
                      echo "name=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_OUTPUT"
                  else
                      echo "name=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Release key
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              shell: bash
              run: |
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                  echo "BV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            - name: Without a release key
              if: env.ANDROID_KEYSTORE_BASE64 == ''
              run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, signing with a debug key. Installed copies cannot be updated to this APK."

            - name: Build APK
              run: gradle -p android assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }}

            - name: Name the APK
              shell: bash
              run: cp android/app/build/outputs/apk/release/app-release.apk "better-vesktop-android-${{ steps.version.outputs.name }}.apk"

            - uses: actions/upload-artifact@v4
              with:
                  name: better-vesktop-android
                  path: better-vesktop-android-*.apk

            - name: Publish release
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/android-v')
              with:
                  name: Better Vesktop for Android ${{ steps.version.outputs.name }}
                  # a prerelease and never "latest": the desktop updater follows the latest release
                  prerelease: true
                  make_latest: false
                  generate_release_notes: true
                  files: better-vesktop-android-*.apk
