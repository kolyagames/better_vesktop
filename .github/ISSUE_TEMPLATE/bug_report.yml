name: Bug report
description: Something in Better Vesktop doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for Better Vesktop: the app, the merged settings, the unified plugin page and the BetterDiscord bridge.
        A bug inside a single plugin belongs to that plugin's author. If a BetterDiscord plugin breaks only here, please report it, mention the plugin and its version.
  - type: input
    id: version
    attributes:
      label: Better Vesktop version
      description: Shown at the bottom of the settings menu
      placeholder: 1.6.7
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How did you install it?
      options: [Portable zip, Installer, Built from source]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open settings\n2. ..."
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: "Ctrl+Shift+I, then paste red errors. Run the app from a terminal to also see messages from the main process. Remove tokens and personal data."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: It also happens when I start with `--vanilla` or with the plugin disabled (tell us which in the description)
        - label: I searched the existing issues
